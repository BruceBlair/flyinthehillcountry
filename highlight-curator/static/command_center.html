<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTN Command Center</title>
<link rel="stylesheet" href="/static/css/command_center.css">
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div id="sidebar-title">GTN</div>
    <a class="nav-item active" data-tab="photos">Photos</a>
    <a class="nav-item" data-tab="timelapse">Timelapse</a>
    <a class="nav-item" data-tab="upload">Upload</a>
    <a class="nav-item" data-tab="platforms">Platforms</a>
    <a class="nav-item" data-tab="status">Status</a>
    <div id="sidebar-footer">
      <a class="nav-item" id="claude-toggle">Claude</a>
    </div>
  </nav>
  <main id="content">
    <div id="tab-photos" class="tab active"></div>
    <div id="tab-timelapse" class="tab">
      <div class="tl-mode-btns">
        <button class="tl-mode-btn active" data-mode="golden">Golden Hour</button>
        <button class="tl-mode-btn" data-mode="fullday">Full Day</button>
        <button class="tl-mode-btn" data-mode="custom">Custom Range</button>
      </div>
      <div class="tl-form" id="tl-form-golden">
        <label>Date <input type="date" id="tl-gh-date"></label>
        <label>Type
          <select id="tl-gh-type">
            <option value="sunrise">Sunrise</option>
            <option value="sunset">Sunset</option>
          </select>
        </label>
      </div>
      <div class="tl-form" id="tl-form-fullday" style="display:none">
        <label>Date <input type="date" id="tl-fd-date"></label>
      </div>
      <div class="tl-form" id="tl-form-custom" style="display:none">
        <label>Start <input type="datetime-local" id="tl-cr-start"></label>
        <label>End   <input type="datetime-local" id="tl-cr-end"></label>
        <label>Label <input type="text" id="tl-cr-label" placeholder="storm_rollout"></label>
      </div>
      <div class="tl-form">
        <div class="tl-timing-row">
          <label><input type="radio" name="tl-timing" value="interval" checked> Interval</label>
          <label><input type="radio" name="tl-timing" value="duration"> Target duration</label>
        </div>
        <div id="tl-interval-row">
          <label>Extract 1 frame every
            <input type="number" id="tl-interval" value="10" min="1" max="300" style="width:70px"> seconds
          </label>
          <div class="tl-estimate" id="tl-est-dur"></div>
        </div>
        <div id="tl-duration-row" style="display:none">
          <label>Make video
            <input type="number" id="tl-duration" value="5" min="1" step="0.5" style="width:70px"> minutes
          </label>
          <div class="tl-estimate" id="tl-est-iv"></div>
        </div>
      </div>
      <div class="tl-actions">
        <button class="ok" id="tl-build-btn">Build Timelapse</button>
        <button id="tl-rebuild-btn" class="ok" style="display:none">Rebuild (<span id="tl-sel-count">0</span>)</button>
        <button id="tl-del-btn" style="display:none">Delete selected</button>
        <span id="tl-build-status" style="font-size:13px;color:#aaa"></span>
      </div>
      <div class="tl-progress-wrap" id="tl-prog-wrap" style="display:none">
        <div class="tl-progress-bar" id="tl-prog-bar"></div>
      </div>
      <div class="tl-list" id="tl-list"></div>
    </div>
    <div id="tab-upload" class="tab"></div>
    <div id="tab-platforms" class="tab"></div>
    <div id="tab-status" class="tab">
      <div class="st-section">
        <div class="st-header">Services</div>
        <div class="st-service-grid" id="st-service-grid"></div>
      </div>
      <div class="st-section">
        <div class="st-header">Photo Library</div>
        <div id="st-manifest-content"></div>
      </div>
      <div class="st-section">
        <div class="st-header">Disk</div>
        <div id="st-disk-content"></div>
      </div>
      <div class="st-section">
        <div class="st-header">Pipeline</div>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
          <button class="ok" id="st-run-btn">Run pipeline now</button>
          <button class="sec" id="st-refresh-btn">Refresh</button>
          <span id="st-pipe-status" style="font-size:13px;color:#aaa"></span>
        </div>
        <div class="log-box" id="st-log-box">Loading...</div>
      </div>
    </div>
  </main>
  <aside id="claude-panel" class="hidden">
    <div id="claude-header">
      <span>Claude</span>
      <button id="claude-close">X</button>
    </div>
    <div id="claude-messages"></div>
    <div id="claude-input-row">
      <input id="claude-input" type="text" placeholder="Ask anything...">
      <button id="claude-send">Send</button>
    </div>
  </aside>
</div>
<div id="toast"></div>
<script src="/static/js/photos.js"></script>
<script src="/static/js/upload.js"></script>
<script src="/static/js/platforms.js"></script>
<script src="/static/js/timelapse.js"></script>
<script src="/static/js/status.js"></script>
<script src="/static/js/claude_panel.js"></script>
<script>
let currentTab = 'photos';

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-item[data-tab]').forEach(n => n.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  const navItem = document.querySelector('.nav-item[data-tab="' + name + '"]');
  if (navItem) navItem.classList.add('active');
  currentTab = name;
  if (name === 'photos')    loadPhotos();
  if (name === 'upload')    loadUploadQueue();
  if (name === 'platforms') loadPlatforms();
  if (name === 'timelapse') loadTimelapse();
  if (name === 'status')    loadStatus();
}

function showToast(msg, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = (ok === false) ? '#c33' : '#2a7';
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 3000);
}

document.querySelectorAll('.nav-item[data-tab]').forEach(el => {
  el.addEventListener('click', () => switchTab(el.dataset.tab));
});
document.getElementById('claude-toggle').addEventListener('click', () => {
  document.getElementById('claude-panel').classList.toggle('hidden');
});
document.getElementById('claude-close').addEventListener('click', () => {
  document.getElementById('claude-panel').classList.add('hidden');
});

window.addEventListener('load', () => switchTab('photos'));
</script>
</body>
</html>
