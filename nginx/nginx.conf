# RECONSTRUCTED, not recovered: the original nginx.conf was already lost (an
# empty directory on disk, not a file) on the old weather-station system
# since 2026-06-06 — over a month before this migration — with no copy in
# git history, any built image, or any stash. There is no way to recover the
# actual prior content.
#
# This is a best-effort reconstruction based on the only two clues available:
# 1. nginx-ssl bind-mounts nginx/certs/{nas.crt,nas.key}, a cert issued for
#    this NAS's LAN IP (192.168.100.202) — i.e. it terminates TLS for this host.
# 2. docker-compose.yml's inline comment on this service says it "reaches
#    Frigate on localhost:5000" (network_mode: host).
#
# Listening on 8443 (not 443) to avoid colliding with the NAS's own admin UI,
# which likely already claims 443. Review and adjust before relying on this
# for anything beyond basic HTTPS access to the Frigate UI/API.

events {
    worker_connections 1024;
}

http {
    server {
        listen 8443 ssl;
        server_name 192.168.100.202 hillshaveeyes.local;

        ssl_certificate     /etc/nginx/certs/nas.crt;
        ssl_certificate_key /etc/nginx/certs/nas.key;

        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
